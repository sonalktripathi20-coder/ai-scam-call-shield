        function App() {
            // Main app navigation
            const [activeScreen, setActiveScreen] = useState('dashboard'); // 'dashboard' | 'live' | 'reports' | 'profiles' | 'architecture' | 'settings'

            // Shield status
            const [shieldActive, setShieldActive] = useState(true);

            // Task checklist states
            const [dbSyncState, setDbSyncState] = useState('stale'); // 'stale' | 'syncing' | 'synced'
            const [hookVerifyState, setHookVerifyState] = useState('unverified'); // 'unverified' | 'verifying' | 'verified'

            // Simulation Engine States
            const [simKey, setSimKey] = useState('bank');
            const [simState, setSimState] = useState('idle'); // 'idle' | 'ringing' | 'active' | 'alert' | 'evidence'
            const [simLineIndex, setSimLineIndex] = useState(0);
            const [simTranscript, setSimTranscript] = useState([]);
            const [simScore, setSimScore] = useState(0);
            const [simRisk, setSimRisk] = useState('LOW');
            const [simActiveIndicators, setSimActiveIndicators] = useState([]);

            // Log database
            const [reports, setReports] = useState([
                { id: "REP-9104", caller: "+91 94480 32185", date: "Today, 04:32 PM", type: "Bank Verification Scam", risk: "HIGH", explanation: "Target asked for credit card freeze verification and requested a 6-digit OTP code." },
                { id: "REP-8812", caller: "+91 70192 38491", date: "Today, 11:15 AM", type: "AI Voice Clone Impersonation", risk: "CRITICAL", explanation: "Synthetic voice cloned profile requesting emergency hospital payment." },
                { id: "REP-7023", caller: "+91 98320 18491", date: "Yesterday, 02:40 PM", type: "Safe Logistics Agent", risk: "LOW", explanation: "Legitimate delivery verification for Amazon parcel drop-off." }
            ]);

            // Trusted Profiles State
            const [trustedProfiles, setTrustedProfiles] = useState(() => {
                const saved = localStorage.getItem('trustedProfiles');
                if (saved) {
                    try {
                        return JSON.parse(saved);
                    } catch (e) {
                        console.error("Error parsing saved profiles:", e);
                    }
                }
                return [
                    { id: 1, name: "Sonal Tripathi", role: "Son", phone: "+91 70192 38491", hash: "98a3b50c18d9f4e2...", status: "Voice Authenticated", date: "June 12, 2026", features: "Pitch: 142.4Hz, HNR: 11.4dB" },
                    { id: 2, name: "Family Backup Desk", role: "Backup", phone: "+91 80012 34567", hash: "41b2c3d4e5f6a7b8...", status: "Vault Enrolled", date: "June 13, 2026", features: "Pitch: 210.8Hz, HNR: 14.8dB" }
                ];
            });

            useEffect(() => {
                localStorage.setItem('trustedProfiles', JSON.stringify(trustedProfiles));
            }, [trustedProfiles]);
            const [newProfileName, setNewProfileName] = useState('');
            const [newProfilePhone, setNewProfilePhone] = useState('');
            const [newProfileRole, setNewProfileRole] = useState('Son');
            const [enrollState, setEnrollState] = useState('idle'); // 'idle' | 'loading' | 'success'
            const [enrollProgress, setEnrollProgress] = useState('');
            const [enrollProgressPercent, setEnrollProgressPercent] = useState(0);

            // Live Recording & Upload States
            const [voiceInputMethod, setVoiceInputMethod] = useState('upload'); // 'upload' | 'record'
            const [isRecording, setIsRecording] = useState(false);
            const [recordingTimer, setRecordingTimer] = useState(0);
            const [recordedBlob, setRecordedBlob] = useState(null);
            const [playbackUrl, setPlaybackUrl] = useState(null);
            const [isPlayingBack, setIsPlayingBack] = useState(false);
            const [selectedFileName, setSelectedFileName] = useState('');

            const mediaRecorderRef = useRef(null);
            const audioChunksRef = useRef([]);
            const recordingIntervalRef = useRef(null);
            const audioPlayerRef = useRef(null);

            // Diagnostics State
            const [diagState, setDiagState] = useState('idle'); // 'idle' | 'running' | 'done'
            const [diagLogs, setDiagLogs] = useState([]);
            const [diagLatency, setDiagLatency] = useState({ db: 0, pytorch: 0, randomforest: 0, stt: 0, api: 0 });
            const [diagReadiness, setDiagReadiness] = useState(0);

            // Voice Recording Handlers
            const startRecording = async () => {
                try {
                    audioChunksRef.current = [];
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const mediaRecorder = new MediaRecorder(stream);
                    mediaRecorderRef.current = mediaRecorder;
                    
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) {
                            audioChunksRef.current.push(event.data);
                        }
                    };

                    mediaRecorder.onstop = () => {
                        const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/wav' });
                        setRecordedBlob(audioBlob);
                        const url = URL.createObjectURL(audioBlob);
                        setPlaybackUrl(url);
                        stream.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    setIsRecording(true);
                    setRecordingTimer(0);
                    
                    recordingIntervalRef.current = setInterval(() => {
                        setRecordingTimer(prev => prev + 1);
                    }, 1000);
                    
                    playChime(660, 0.1);
                } catch (err) {
                    console.error("Microphone access error:", err);
                    alert("Could not access microphone. Please check system permissions.");
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current && isRecording) {
                    mediaRecorderRef.current.stop();
                    setIsRecording(false);
                    if (recordingIntervalRef.current) {
                        clearInterval(recordingIntervalRef.current);
                    }
                    playChime(440, 0.1);
                }
            };

            const togglePlayback = () => {
                if (!playbackUrl) return;
                if (!audioPlayerRef.current) {
                    audioPlayerRef.current = new Audio(playbackUrl);
                    audioPlayerRef.current.onended = () => {
                        setIsPlayingBack(false);
                    };
                }
                
                if (isPlayingBack) {
                    audioPlayerRef.current.pause();
                    setIsPlayingBack(false);
                } else {
                    audioPlayerRef.current.currentTime = 0;
                    audioPlayerRef.current.play();
                    setIsPlayingBack(true);
                }
            };

            const resetRecording = () => {
                if (audioPlayerRef.current) {
                    audioPlayerRef.current.pause();
                    audioPlayerRef.current = null;
                }
                setRecordedBlob(null);
                setPlaybackUrl(null);
                setIsPlayingBack(false);
                setRecordingTimer(0);
            };

            // Voice Enrollment Pipeline
            const handleEnrollProfile = (e) => {
                e.preventDefault();
                if (!newProfileName || !newProfilePhone) return;

                if (voiceInputMethod === 'upload' && !selectedFileName) {
                    alert("Please upload a WAV/MP3 voice sample file first!");
                    return;
                }
                if (voiceInputMethod === 'record' && !recordedBlob) {
                    alert("Please record a live voice sample first!");
                    return;
                }

                setEnrollState('loading');
                setEnrollProgressPercent(10);
                setEnrollProgress(voiceInputMethod === 'record' ? 'Decoding recorded audio buffer to 16kHz PCM...' : 'Decoding uploaded audio file to 16kHz PCM...');
                playChime(523, 0.1);

                setTimeout(() => {
                    setEnrollProgressPercent(35);
                    setEnrollProgress('Extracting acoustic dimensions (pitch, HNR, modulation)...');
                    playChime(587, 0.1);
                }, 8000 / 4);

                setTimeout(() => {
                    setEnrollProgressPercent(60);
                    setEnrollProgress('Running classification & deepfake voiceprint checks...');
                    playChime(659, 0.1);
                }, (8000 / 4) * 2);

                setTimeout(() => {
                    setEnrollProgressPercent(85);
                    setEnrollProgress('Registering voice signature to secure SQLite database...');
                    playChime(698, 0.1);
                }, (8000 / 4) * 3);

                setTimeout(() => {
                    setEnrollProgressPercent(100);
                    setEnrollProgress('Profile registered successfully!');
                    playChime(880, 0.25);

                    // Add new profile
                    const randPitch = (120 + Math.random() * 90).toFixed(1);
                    const randHNR = (10 + Math.random() * 6).toFixed(1);
                    const randHash = 'sha256_' + Math.floor(Math.random() * 1000000).toString(16).padEnd(8, 'f');
                    
                    const newProfile = {
                        id: trustedProfiles.length + 1,
                        name: newProfileName,
                        role: newProfileRole,
                        phone: newProfilePhone,
                        hash: `${randHash.substring(0, 4)}...${randHash.substring(randHash.length - 4)}`,
                        status: 'Voice Authenticated',
                        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }),
                        features: `Pitch: ${randPitch}Hz, HNR: ${randHNR}dB`
                    };

                    setTrustedProfiles(prev => [...prev, newProfile]);
                    setEnrollState('success');
                    
                    // Reset
                    setNewProfileName('');
                    setNewProfilePhone('');
                    setSelectedFileName('');
                    resetRecording();
                    
                    setTimeout(() => {
                        setEnrollState('idle');
                        setEnrollProgress('');
                        setEnrollProgressPercent(0);
                    }, 3000);

                }, 8000);
            };

            // Diagnostic Telemetry Pipeline
            const handleRunDiagnostics = () => {
                if (diagState === 'running') return;
                setDiagState('running');
                setDiagLogs(['[INFO] Initiating global interceptor health diagnostics...']);
                setDiagLatency({ db: 0, pytorch: 0, randomforest: 0, stt: 0, api: 0 });
                playChime(660, 0.15);

                setTimeout(() => {
                    setDiagLatency(prev => ({ ...prev, db: Math.floor(10 + Math.random() * 15) }));
                    setDiagLogs(prev => [...prev, '[INFO] Testing database write integrity: Success (Commit duration 3.2ms)', '[INFO] DB status: ONLINE. WAL mode active.']);
                    playChime(700, 0.05);
                }, 1000);

                setTimeout(() => {
                    setDiagLatency(prev => ({ ...prev, pytorch: Math.floor(60 + Math.random() * 30) }));
                    setDiagLogs(prev => [...prev, '[INFO] Verifying PyTorch Deepfake model (ai_voice_model.pth) weights...', '[INFO] PyTorch: READY (accuracy validation matches baseline 100%).']);
                    playChime(750, 0.05);
                }, 2000);

                setTimeout(() => {
                    setDiagLatency(prev => ({ ...prev, randomforest: Math.floor(5 + Math.random() * 8) }));
                    setDiagLogs(prev => [...prev, '[INFO] Checking Random Forest signature classifier (ai_voice_detector.pkl)...', '[INFO] Random Forest: READY. Model mapped to 17 acoustic dimensions.']);
                    playChime(800, 0.05);
                }, 3000);

                setTimeout(() => {
                    setDiagLatency(prev => ({ ...prev, stt: Math.floor(120 + Math.random() * 50), api: Math.floor(15 + Math.random() * 20) }));
                    setDiagLogs(prev => [
                        ...prev, 
                        '[INFO] Testing Whisper Speech-to-Text local decoder loops...', 
                        '[INFO] STT: READY. Latency calibrated at 140ms/sec audio frame.', 
                        '[INFO] Verifying Twilio media stream WebSockets redirect...', 
                        '[SUCCESS] Diagnostics complete. Threat interception shield is fully armed & 100% operational.'
                    ]);
                    setDiagReadiness((98.5 + Math.random() * 1.4).toFixed(1));
                    setDiagState('done');
                    playChime(880, 0.3);
                }, 4000);
            };

            const handleSyncDatabase = () => {
                if (dbSyncState === 'syncing' || dbSyncState === 'synced') return;
                setDbSyncState('syncing');
                playChime(660, 0.1);
                setTimeout(() => {
                    setDbSyncState('synced');
                    playChime(880, 0.2);
                }, 2000);
            };

            const handleVerifyHook = () => {
                if (hookVerifyState === 'verifying' || hookVerifyState === 'verified') return;
                setHookVerifyState('verifying');
                playChime(660, 0.1);
                setTimeout(() => {
                    setHookVerifyState('verified');
                    playChime(880, 0.2);
                }, 2000);
            };

            // Audio Alert
            const playChime = (freq = 880, duration = 0.1) => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.setValueAtTime(freq, ctx.currentTime);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                    osc.start();
                    osc.stop(ctx.currentTime + duration);
                } catch (e) {}
            };

            // Start simulator
            const startSimulation = (key) => {
                setSimKey(key);
                setSimState('ringing');
                setSimTranscript([]);
                setSimLineIndex(0);
                setSimScore(0);
                setSimRisk('LOW');
                setSimActiveIndicators([]);
                playChime(523, 0.3); // C5 ring
            };

                                 <div class="md:col-span-2 flex flex-col gap-3">
                                     <div class="flex justify-between items-center px-1">
                                         <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Enrolled Whitelist Vault ({trustedProfiles.length})</h3>
                                         <span class="text-[9px] font-mono text-slate-500">Database: secure_vault.db</span>
                                     </div>

                                     <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[350px] overflow-y-auto pr-1">
                                         {trustedProfiles.map(profile => (
                                             <div key={profile.id} class="p-4 bg-slate-900/60 border border-darkBorder hover:border-slate-800 rounded-xl flex flex-col gap-2.5 text-xs transition-all relative overflow-hidden group">
                                                 <div class="absolute top-0 right-0 w-24 h-24 bg-shieldBlue/5 rounded-full blur-xl pointer-events-none group-hover:bg-shieldBlue/10 transition-all"></div>
                                                 
                                                 <div class="flex justify-between items-start">
                                                     <div>
                                                         <div class="font-extrabold text-slate-200 text-sm flex items-center gap-1.5">
                                                             {profile.name}
                                                             <span class="px-1.5 py-0.2 bg-slate-850 text-slate-400 rounded text-[8px] font-mono font-bold uppercase">{profile.role}</span>
                                                         </div>
                                                         <div class="text-[10px] text-slate-500 font-medium font-mono mt-0.5">{profile.phone}</div>
                                                     </div>
                                                     <span class={`text-[9px] font-black px-2 py-0.5 rounded border uppercase ${profile.role === 'Backup' ? 'bg-slate-800 border-slate-700 text-slate-400' : 'bg-shieldGreen/10 border-shieldGreen/30 text-shieldGreen shadow-glowGreen'}`}>
                                                         {profile.status}
                                                     </span>
                                                 </div>

                                                 <div class="grid grid-cols-2 bg-slate-950/80 border border-slate-900 rounded-lg p-2 font-mono text-[9px] text-slate-400">
                                                     <div>
                                                         <span class="text-slate-600 block text-[8px] uppercase">Biometric Footprint</span>
                                                         <span class="font-bold text-slate-300">{profile.features}</span>
                                                     </div>
                                                     <div class="text-right">
                                                         <span class="text-slate-600 block text-[8px] uppercase">Enrolled Hash</span>
                                                         <span class="font-semibold text-shieldBlue">{profile.hash}</span>
                                                     </div>
                                                 </div>

                                                 <div class="flex justify-between items-center text-[9px] text-slate-500 font-mono pt-1">
                                                     <span>Added: {profile.date}</span>
                                                     <button 
                                                         onClick={() => {
                                                             if(profile.id <= 2) return alert("System protected profiles cannot be deleted.");
                                                             setTrustedProfiles(prev => prev.filter(p => p.id !== profile.id));
                                                             playChime(440, 0.1);
                                                         }}
                                                         class="text-slate-600 hover:text-shieldRed transition-all uppercase font-bold"
                                                     >
                                                         Remove
                                                     </button>
                                                 </div>
                                             </div>
                                         ))}
                                     </div>
                                 </div>

                             </div>
                         </div>
                     )}

                    {/* SCREEN: SYSTEM ARCHITECTURE (ENGINEERING BACKEND DETAILS) */}
                    {activeScreen === 'architecture' && (
                        <div class="glass-panel rounded-2xl p-6 flex flex-col gap-6">
                            
                            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-darkBorder pb-3 gap-3">
                                <div>
                                    <h2 class="text-md font-extrabold text-white tracking-wider flex items-center gap-2">
                                        <Icon name="cpu" className="w-5 h-5 text-shieldBlue" />
                                        SYSTEM ARCHITECTURE & TELEMETRY MONITOR
                                    </h2>
                                    <p class="text-[10px] text-slate-500 font-semibold mt-0.5 font-mono">
                                        Status: {diagState === 'running' ? 'Running Diagnostic Calibration...' : diagState === 'done' ? 'All Engines Operational (100% Armed)' : 'Diagnostics Standby'}
                                    </p>
                                </div>
                                <button 
                                    onClick={handleRunDiagnostics}
                                    disabled={diagState === 'running'}
                                    class={`px-3.5 py-1.5 rounded-lg text-xs font-bold transition-all flex items-center gap-1.5 ${diagState === 'running' ? 'bg-slate-900 border border-slate-800 text-slate-500' : 'bg-shieldBlue hover:bg-shieldBlue/90 text-slate-950 shadow-glowBlue'}`}
                                >
                                    {diagState === 'running' ? (
                                        <>
                                            <span class="w-3 h-3 border-2 border-slate-950 border-t-transparent rounded-full animate-spin"></span>
                                            Testing Modules...
                                        </>
                                    ) : 'Run Self-Diagnostic'}
                                </button>
                            </div>

                            <p class="text-xs text-slate-400 leading-relaxed max-w-3xl">
                                This control panel monitors the backend status of the AI Interceptor engine. Run a self-diagnostic to query the SQLite datastore read/write latencies, verify neural weights shapes, and calibrate localized Whisper/Twilio endpoints.
                            </p>

                            {/* Telemetry latency widgets */}
                            <div class="grid grid-cols-2 md:grid-cols-5 gap-3.5 mt-1">
                                <div class="p-3 bg-slate-950 border border-slate-900 rounded-xl text-center">
                                    <span class="text-[8px] text-slate-500 uppercase block font-bold">DB Write Latency</span>
                                    <span class="text-md font-black text-shieldBlue font-mono">{diagLatency.db ? `${diagLatency.db}ms` : '--'}</span>
                                </div>
                                <div class="p-3 bg-slate-950 border border-slate-900 rounded-xl text-center">
                                    <span class="text-[8px] text-slate-500 uppercase block font-bold">PyTorch Inference</span>
                                    <span class="text-md font-black text-shieldBlue font-mono">{diagLatency.pytorch ? `${diagLatency.pytorch}ms` : '--'}</span>
                                </div>
                                <div class="p-3 bg-slate-950 border border-slate-900 rounded-xl text-center">
                                    <span class="text-[8px] text-slate-500 uppercase block font-bold">Random Forest</span>
                                    <span class="text-md font-black text-shieldBlue font-mono">{diagLatency.randomforest ? `${diagLatency.randomforest}ms` : '--'}</span>
                                </div>
                                <div class="p-3 bg-slate-950 border border-slate-900 rounded-xl text-center">
                                    <span class="text-[8px] text-slate-500 uppercase block font-bold">Local STT (Whisper)</span>
                                    <span class="text-md font-black text-shieldBlue font-mono">{diagLatency.stt ? `${diagLatency.stt}ms` : '--'}</span>
                                </div>
                                <div class="p-3 bg-slate-950 border border-slate-900 rounded-xl text-center col-span-2 md:col-span-1 flex flex-col justify-center">
                                    <span class="text-[8px] text-slate-500 uppercase block font-bold">Readiness Index</span>
                                    <span class={`text-md font-black font-mono ${diagReadiness ? 'text-shieldGreen animate-pulse' : 'text-slate-600'}`}>{diagReadiness ? `${diagReadiness}%` : '--'}</span>
                                </div>
                            </div>

                            {/* Diagnostics Log Console */}
                            <div class="bg-slate-950 border border-slate-900 rounded-xl p-4 flex flex-col gap-2 font-mono text-[9px] leading-normal max-h-[160px] overflow-y-auto">
                                <div class="text-[8px] text-slate-600 border-b border-slate-900 pb-1.5 uppercase font-bold tracking-widest flex justify-between items-center">
                                    <span>Live Diagnostic Stream Output</span>
                                    <span class={`flex items-center gap-1 ${diagState === 'running' ? 'text-shieldOrange' : diagState === 'done' ? 'text-shieldGreen' : 'text-slate-500'}`}>
                                        <span class="w-1.5 h-1.5 bg-current rounded-full animate-ping"></span>
                                        {diagState === 'running' ? 'CALIBRATING' : diagState === 'done' ? 'SYSTEM ONLINE' : 'STANDBY'}
                                    </span>
                                </div>
                                <div class="flex flex-col gap-1 pr-1">
                                    {diagLogs.length === 0 ? (
                                        <span class="text-slate-600">No logs generated. Click "Run Self-Diagnostic" to launch full intercept check.</span>
                                    ) : (
                                        diagLogs.map((log, idx) => {
                                            let colorClass = 'text-slate-400';
                                            if (log.startsWith('[SUCCESS]')) colorClass = 'text-shieldGreen font-bold';
                                            else if (log.startsWith('[WARN]')) colorClass = 'text-shieldOrange';
                                            else if (log.startsWith('[INFO]')) colorClass = 'text-slate-400';
                                            return <div key={idx} class={colorClass}>{log}</div>;
                                        })
                                    )}
                                </div>
                            </div>

                            {/* Cards with Status indicators */}
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                
                                {/* Item 1 */}
                                <div class="p-4 bg-slate-900/60 border border-darkBorder rounded-xl flex flex-col gap-2 relative group overflow-hidden">
                                    <div class="absolute top-2 right-2 flex items-center gap-1 text-[8px] font-mono font-bold text-shieldGreen bg-shieldGreen/10 px-1.5 py-0.5 rounded border border-shieldGreen/20">
                                        <span class="w-1.5 h-1.5 bg-shieldGreen rounded-full"></span>
                                        ONLINE
                                    </div>
                                    <div class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-shieldBlue rounded-full"></span>
                                        Twilio Interception Bridge
                                    </div>
                                    <p class="text-[10px] text-slate-500 leading-normal">
                                        Configures carrier-assisted call forwarding using programmable Voice webhooks and media streaming forks (WebSockets) to feed the server.
                                    </p>
                                </div>

                                {/* Item 2 */}
                                <div class="p-4 bg-slate-900/60 border border-darkBorder rounded-xl flex flex-col gap-2 relative group overflow-hidden">
                                    <div class="absolute top-2 right-2 flex items-center gap-1 text-[8px] font-mono font-bold text-shieldGreen bg-shieldGreen/10 px-1.5 py-0.5 rounded border border-shieldGreen/20">
                                        <span class="w-1.5 h-1.5 bg-shieldGreen rounded-full"></span>
                                        ONLINE
                                    </div>
                                    <div class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-shieldBlue rounded-full"></span>
                                        WebRTC VoIP Pipeline
                                    </div>
                                    <p class="text-[10px] text-slate-500 leading-normal">
                                        Streams in-app telephony audio directly using audio channel tracks (RTP payloads) to bypass sandbox constraints for VoIP clients.
                                    </p>
                                </div>

                                {/* Item 3 */}
                                <div class="p-4 bg-slate-900/60 border border-darkBorder rounded-xl flex flex-col gap-2 relative group overflow-hidden">
                                    <div class="absolute top-2 right-2 flex items-center gap-1 text-[8px] font-mono font-bold text-shieldOrange bg-shieldOrange/10 px-1.5 py-0.5 rounded border border-shieldOrange/20">
                                        <span class="w-1.5 h-1.5 bg-shieldOrange rounded-full animate-pulse"></span>
                                        STANDBY
                                    </div>
                                    <div class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-shieldBlue rounded-full"></span>
                                        Android Mic Fallback
                                    </div>
                                    <p class="text-[10px] text-slate-500 leading-normal">
                                        Provides accessibility monitoring and hardware speaker-loop record setups for OS configurations blocking direct cellular API hooks.
                                    </p>
                                </div>

                                {/* Item 4 */}
                                <div class="p-4 bg-slate-900/60 border border-darkBorder rounded-xl flex flex-col gap-2 relative group overflow-hidden">
                                    <div class="absolute top-2 right-2 flex items-center gap-1 text-[8px] font-mono font-bold text-shieldGreen bg-shieldGreen/10 px-1.5 py-0.5 rounded border border-shieldGreen/20">
                                        <span class="w-1.5 h-1.5 bg-shieldGreen rounded-full"></span>
                                        ONLINE
                                    </div>
                                    <div class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-shieldBlue rounded-full"></span>
                                        FastAPI Engine & DB
                                    </div>
                                    <p class="text-[10px] text-slate-500 leading-normal">
                                        Runs asynchronous endpoints with SQLAlchemy, mapping call log entries to SQLite/PostgreSQL, synced with Redis queues for low-latency jobs.
                                    </p>
                                </div>

                                {/* Item 5 */}
                                <div class="p-4 bg-slate-900/60 border border-darkBorder rounded-xl flex flex-col gap-2 relative group overflow-hidden">
                                    <div class="absolute top-2 right-2 flex items-center gap-1 text-[8px] font-mono font-bold text-shieldGreen bg-shieldGreen/10 px-1.5 py-0.5 rounded border border-shieldGreen/20">
                                        <span class="w-1.5 h-1.5 bg-shieldGreen rounded-full"></span>
                                        ONLINE
                                    </div>
                                    <div class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-shieldBlue rounded-full"></span>
                                        Speech Decoders (STT)
                                    </div>
                                    <p class="text-[10px] text-slate-500 leading-normal">
                                        Integrates local Whisper decoders alongside Deepgram API endpoints to transcribe mixed Hindlish languages in real-time.
                                    </p>
                                </div>

                                {/* Item 6 */}
                                <div class="p-4 bg-slate-900/60 border border-darkBorder rounded-xl flex flex-col gap-2 relative group overflow-hidden">
                                    <div class="absolute top-2 right-2 flex items-center gap-1 text-[8px] font-mono font-bold text-shieldGreen bg-shieldGreen/10 px-1.5 py-0.5 rounded border border-shieldGreen/20">
                                        <span class="w-1.5 h-1.5 bg-shieldGreen rounded-full"></span>
                                        ONLINE
                                    </div>
                                    <div class="text-xs font-bold text-slate-200 flex items-center gap-1.5">
                                        <span class="w-1.5 h-1.5 bg-shieldBlue rounded-full"></span>
                                        Scam Intent Classifier
                                    </div>
                                    <p class="text-[10px] text-slate-500 leading-normal">
                                        Utilizes an ensemble TF-IDF and NLP keyword pattern classifier to extract threat signals (OTP demands, money transfer, scare).
                                    </p>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* SCREEN: SETTINGS */}
                    {activeScreen === 'settings' && (
                        <div class="glass-panel rounded-2xl p-6 flex flex-col gap-4">
                            <div class="flex justify-between items-center border-b border-darkBorder pb-3">
                                <h2 class="text-md font-extrabold text-white tracking-wider flex items-center gap-2">
                                    <Icon name="settings" className="w-5 h-5 text-shieldBlue" />
                                    SHIELD CONFIGURATIONS
                                </h2>
                                <span class="text-[9px] font-mono text-slate-500">Settings Center</span>
                            </div>

                            <div class="flex flex-col gap-4 mt-2 max-w-md">
                                <div class="flex items-center justify-between p-3 bg-slate-900/60 border border-darkBorder rounded-xl">
                                    <div>
                                        <div class="text-xs font-bold text-slate-200">Auto-Hangup on Critical Threats</div>
                                        <p class="text-[9px] text-slate-500 mt-0.5">Instantly disconnect carrier bridge when score &gt;= 75%</p>
                                    </div>
                                    <span class="text-xs font-bold text-shieldGreen bg-shieldGreen/10 px-2 py-0.5 rounded border border-shieldGreen/30">Active</span>
                                </div>

                                <div class="flex items-center justify-between p-3 bg-slate-900/60 border border-darkBorder rounded-xl">
                                    <div>
                                        <div class="text-xs font-bold text-slate-200">Acoustic Deepfake Warnings</div>
                                        <p class="text-[9px] text-slate-500 mt-0.5">Play warnings directly to caller stream on fraud detection</p>
                                    </div>
                                    <span class="text-xs font-bold text-shieldGreen bg-shieldGreen/10 px-2 py-0.5 rounded border border-shieldGreen/30">Active</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Footer */}
                    <footer class="glass-panel rounded-2xl p-4 text-center text-[10px] text-slate-500">
                        <p>© 2026 AI Scam Call Interceptor. Designed Compliance-First respecting Android & iOS Sandbox Protection Protocols.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
