                        }

                    combined.forEach(p => {
                        if (p && p.userid && p.username) {

                        }

                    updatedList.push(newProfile);
                    setAvailableProfiles(updatedList);
                    localStorage.setItem('scamShieldProfileList', JSON.stringify(updatedList));
